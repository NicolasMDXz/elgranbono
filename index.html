<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado del Sorteo</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f9f9fe;
      font-family: "Quicksand", "Nunito", "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding-top: 40px;
    }

    .resultado {
      background: linear-gradient(135deg, #1e3a6f 0%, #2d5298 100%);
      color: #fff;
      border-radius: 18px;
      padding: 34px 16px 45px;
      text-align: center;
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.27), 0 3px 8px rgba(0, 0, 0, 0.10);
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    h1, h2, .fecha {
      color: #334255;
      font-weight: 600;
      text-shadow: 0 3px 4px rgba(255,255,255,.7), 0 3px 6px rgba(255,255,255,.3);
    }

    h1 {
      font-size: clamp(34px, 8.6vw, 52px);
      letter-spacing: 0;
      line-height: 1.25;
      margin: 0 0 25.5px;
    }

    h2 {
      font-size: clamp(34px, 8.6vw, 52px);
      line-height: 1.48;
      margin: 0 0 1.5px;
    }

    .fecha {
      font-size: clamp(34px, 8.6vw, 52px);
      line-height: 1.48;
      margin: 0;
    }

    .registro {
      font-size: clamp(16px, 4.1vw, 23px);
      font-weight: 400;
      line-height: 1.25;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .numero {
      font-size: clamp(30px, 8.4vw, 60px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.25;
      margin-top: 48px;
      text-shadow: 0 0 5px rgba(255,255,255,.7), 0 0 2px #fff;
    }

    .raya {
      display: block;
      width: 36%;
      max-width: 270px;
      height: auto;
      margin: 18px auto 0;
    }
  </style>
</head>

<body>
  <div class="resultado">
    <h1>Resultado del Sorteo</h1>
    <h2 id="sorteo">----</h2>
    <div class="fecha" id="fecha">--/--/---/--</div>
    <div class="registro" id="registro"></div>
    <div class="numero" id="numero"></div>
    <svg class="raya" viewBox="0 0 273 23" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#fff" d="M12.0 0.0 C16.2 0.2 28.7 0.6 37.0 1.2 C45.3 1.9 53.7 2.9 62.0 3.7 C70.3 4.6 78.7 5.6 87.0 6.2 C95.3 6.9 103.7 7.5 112.0 7.7 C120.3 7.9 128.7 7.4 137.0 7.3 C145.3 7.2 153.7 7.0 162.0 7.2 C170.3 7.4 178.7 8.3 187.0 8.3 C195.3 8.4 203.7 7.9 212.0 7.3 C220.3 6.6 228.7 5.3 237.0 4.5 C245.3 3.8 257.8 2.9 262.0 2.6 A9.4 9.4 0 0 1 262.0 21.4 C257.8 21.4 245.3 21.2 237.0 21.5 C228.7 21.7 220.3 22.7 212.0 22.8 C203.7 22.9 195.3 22.3 187.0 21.9 C178.7 21.5 170.3 21.1 162.0 20.7 C153.7 20.2 145.3 19.6 137.0 19.3 C128.7 19.0 120.3 18.9 112.0 19.0 C103.7 19.1 95.3 19.6 87.0 19.8 C78.7 20.0 70.3 19.9 62.0 20.0 C53.7 20.1 45.3 20.2 37.0 20.5 C28.7 20.7 16.2 21.4 12.0 21.6 A10.8 10.8 0 0 1 12.0 0.0 Z"/>
    </svg>
  </div>

  <script>
    /*
     * Ejemplo de URL (la genera el QR del boleto):
     * ?id=OAX-153MIL-2026-10-29
     */

    // ✏️ CAMBIA AQUÍ EL NÚMERO GANADOR CUANDO QUIERAS
    const NUMERO_GANADOR = "00891";

    const DIAS = ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"];
    const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN",
                   "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

    function formatoFecha(iso) {
      const [a, m, d] = iso.split("-").map(Number);
      const f = new Date(a, m - 1, d);

      return DIAS[f.getDay()] + "/" + d + "/" +
             MESES[m - 1] + "/" + String(a).slice(2);
    }

    // Siempre en miles: "153MIL", "153" y "153000" salen como 153MIL
    function aMil(texto) {
      const n = parseFloat(texto);

      if (!n) return "----";

      const mil = (/MIL/i.test(texto) || n < 1000) ? n : n / 1000;

      return (Math.round(mil * 10) / 10) + "MIL";
    }

    function hoyISO() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");

      return d.getFullYear() + "-" + mm + "-" + dd;
    }

    const id = new URLSearchParams(window.location.search).get("id") || "";
    const partes = id.match(/^([A-Z]+)-(\d+(?:\.\d+)?(?:MIL)?)-(\d{4}-\d{2}-\d{2})$/);

    if (partes) {
      const fecha = partes[3];

      document.getElementById("sorteo").textContent = partes[1] + " " + aMil(partes[2]);
      document.getElementById("fecha").textContent = formatoFecha(fecha);

      if (fecha > hoyISO()) {
        document.getElementById("numero").textContent = "-----";
        document.getElementById("registro").textContent = "Resultado pendiente";
      } else {
        document.getElementById("numero").textContent = NUMERO_GANADOR;
        document.getElementById("registro").textContent = fecha + "T00:00:00";
      }
    } else {
      document.getElementById("numero").textContent = "-----";
      document.getElementById("registro").textContent = "Sin registro";
    }
  </script>
</body>
</html>
